<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista Previa</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111; /* Fondo oscuro elegante */
            display: flex;
